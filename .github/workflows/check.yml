name: Check

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  # On a pull request, supersede the previous run for that PR. On a push to main
  # the PR number is null, so keying on the ref would give every merge the same
  # group and each merge would cancel the previous merge's validation. Key on the
  # commit instead, so post-merge runs never cancel each other.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  check:
    name: Repo gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: scripts/check-repo.sh
        run: ./scripts/check-repo.sh
      - name: scripts/check-install.sh
        # A step in this job rather than a job of its own, so it is covered by
        # the required status check that already exists. Too slow for the commit
        # hook at ~2s; run it by hand when touching the install section.
        run: ./scripts/check-install.sh
