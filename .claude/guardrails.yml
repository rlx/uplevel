# Repository checklist. Re-audit as a diff against this file.
# status: present | absent | unsupported here | unknown | enforced
audited: 2026-08-19

checks:
  - id: gate-runs-on-commit
    status: enforced
    by: .git/hooks/pre-commit -> scripts/check-repo.sh

  - id: broken-reference-fails-gate
    status: enforced
    by: skills/uplevel/selfcheck.sh

  - id: shipped-commands-parse
    status: enforced
    by: selfcheck.sh; bash -n on fenced blocks, plus grep -E pattern validation

  - id: skill-md-under-4k-tokens
    status: enforced
    by: selfcheck.sh

  - id: relative-links-resolve
    status: enforced
    by: scripts/check-repo.sh; tracked files only

  - id: hook-installed-and-current
    status: enforced
    by: scripts/check-repo.sh

  - id: hook-check-skipped-in-ci
    status: enforced
    by: scripts/check-repo.sh; CI env var guard

  - id: ci-on-push
    status: enforced
    by: .github/workflows/check.yml -> scripts/check-repo.sh

  - id: ci-on-pull-request
    status: present, unverified
    by: .github/workflows/check.yml -> scripts/check-repo.sh
    note: the pull_request trigger is configured but has never fired; every run
      so far was a push. Verified when a pull request first runs it.

  - id: branch-protection-required-checks
    status: unsupported here
    note: the API returns 403 while the repository is private on a free plan.
      Becomes available on going public; then require the "Repo gate" check on
      main. Owner decision.

  - id: secret-scanning-and-push-protection
    status: unsupported here
    note: free on public repositories, unavailable on private ones without
      Advanced Security. Enable when visibility changes.

  - id: action-update-automation
    status: enforced
    by: .github/dependabot.yml; github-actions ecosystem, monthly

  - id: security-policy
    status: present
    by: SECURITY.md

  - id: licence
    status: present
    by: LICENSE (MIT)

  - id: codeowners
    status: absent
    note: single maintainer; revisit if contributors join.
