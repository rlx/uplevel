# Repository checklist. Re-audit as a diff against this file.
# status: present | absent | unsupported here | unknown | enforced
audited: 2026-08-19
last_audit_scope: >
  Re-audit as a diff. Verified this pass: gate, workflow triggers and
  permissions, action pinning, ruleset, repository security settings,
  code scanning, toolchain portability.
visibility: public

checks:
  - id: gate-runs-on-commit
    status: enforced
    by: .git/hooks/pre-commit -> scripts/check-repo.sh

  - id: broken-reference-fails-gate
    status: enforced
    by: skills/uplevel/selfcheck.sh

  - id: shipped-commands-parse
    status: enforced
    by: selfcheck.sh; bash -n on fenced blocks, plus grep -E pattern validation

  - id: skill-md-under-4k-tokens
    status: enforced
    by: selfcheck.sh

  - id: relative-links-resolve
    status: enforced
    by: scripts/check-repo.sh; tracked files only

  - id: hook-installed-and-current
    status: enforced
    by: scripts/check-repo.sh

  - id: hook-check-skipped-in-ci
    status: enforced
    by: scripts/check-repo.sh; CI env var guard

  - id: ci-on-push
    status: enforced
    by: .github/workflows/check.yml -> scripts/check-repo.sh

  - id: ci-on-pull-request
    status: enforced
    by: .github/workflows/check.yml -> scripts/check-repo.sh
    note: >-
      verified on PR #1, which ran the real checks rather than passing
      vacuously; the CI guard correctly skipped the local hook check.

  - id: branch-protection-required-checks
    status: enforced
    by: ruleset "Protect main" (21026886), active, no bypass actors
    note: >-
      requires a pull request, branches up to date, and two checks - "Repo gate"
      and "Analyze (actions)" from CodeQL. Blocks force-push and deletion, no
      bypass actors. Verified behaviourally on 2026-08-19 - a direct push to main
      was rejected with both the pull-request and required-status-check rules
      cited. CodeQL was added to the required set once it had been observed
      running on a pull request head; an advisory check is ignored within a week.

  - id: secret-scanning
    status: enforced
    by: repository security settings

  - id: push-protection
    status: present, unverified
    by: repository security settings
    note: >-
      reported enabled by the API. A behavioural test was attempted and was
      inconclusive - the credential values used were vendor-published example
      keys, which scanners allowlist. Not retried, because any string that would
      prove the control also looks like a real secret in a public repository.

  - id: dependabot-security-updates
    status: enforced
    by: vulnerability alerts + automated security fixes

  - id: action-update-automation
    status: enforced
    by: .github/dependabot.yml; github-actions ecosystem, monthly

  - id: security-policy
    status: present
    by: SECURITY.md

  - id: licence
    status: present
    by: LICENSE (MIT)

  - id: code-scanning
    status: enforced
    by: CodeQL default setup, query suite "default", weekly
    note: >-
      languages ["actions"] - the workflow is the analysable surface here.
      Enabled 2026-08-19; setup run 32231629098 completed successfully. The
      previous audit recorded this as unknown because the token lacked
      security_events; the code-scanning/default-setup endpoint answers without
      that scope and reported not-configured.
    last_checked: 2026-08-19

  - id: branch-deleted-on-merge
    status: enforced
    by: repository setting delete_branch_on_merge
    last_checked: 2026-08-19

  - id: secret-scanning-non-provider-patterns
    status: absent
    note: >-
      NOT settable through PATCH /repos/{owner}/{repo}. The endpoint returns
      200 and silently discards the field - confirmed by sending a bogus value,
      which was also accepted. Not a permissions problem: the same token changed
      an unrelated setting on the same endpoint and the change was observed on
      re-read. A dedicated PUT endpoint was also tried and does not exist for
      either control, unlike private-vulnerability-reporting which has one.
      Needs the web UI, Settings > Advanced Security.
    last_checked: 2026-08-19

  - id: secret-scanning-validity-checks
    status: absent
    note: same endpoint behaviour as non-provider-patterns above.
    last_checked: 2026-08-19

  - id: gate-scripts-portable
    status: enforced
    by: scripts/check-repo.sh against scripts/gnu-only-constructs.txt
    note: >-
      CI is ubuntu-latest (bash 5, GNU coreutils); a maintainer here runs
      bash 3.2.57 with ugrep 7.5.0 and BSD sed, and the commit hook gates on
      that one. 9 GNU-only constructs are checked for. Verified red-then-green.
    last_checked: 2026-08-19

  - id: skill-md-headroom-visible
    status: enforced
    by: selfcheck.sh prints tokens used, budget, and remainder
    note: >-
      the gate prints the live figure on every run, so this entry deliberately
      records no number - the previous version pinned one and went stale in a
      single commit. Growth is the thing to watch: one merge has consumed about
      10 percent of the budget before now.
    last_checked: 2026-08-19

  - id: checklist-parses
    status: enforced
    by: scripts/check-repo.sh; python3 + pyyaml, skipped when absent
    note: >-
      this file shipped unparseable - an unquoted "PR #1" started a YAML comment
      mid-value and truncated the block. Nothing read the file, so nothing
      noticed. Multi-line notes now use block scalars. Verified red-then-green.
    last_checked: 2026-08-19

  - id: private-vulnerability-reporting
    status: enforced
    by: repository setting; SECURITY.md directs reporters to it
    note: >-
      enabled 2026-08-19 via PUT /repos/{owner}/{repo}/private-vulnerability-reporting,
      confirmed by re-read. Previously disabled while SECURITY.md instructed
      researchers to use it - the policy named a channel that did not exist, and
      its own fallback sent them to a public issue.
    last_checked: 2026-08-19

  - id: leakage-scan-by-shape
    status: enforced
    by: skills/uplevel/selfcheck.sh against skills/uplevel/leak-patterns.txt
    note: >-
      scans *.md and *.sh for machine- and project-specific shapes. The previous
      version was a denylist of known names scanning markdown only, so it could
      not see the script it lived in. Patterns are held in a data file so they
      cannot match themselves. Verified red-then-green.
    last_checked: 2026-08-19

  - id: codeowners
    status: absent
    note: >-
      two copyright holders, one active maintainer; a CODEOWNERS file would
      encode review routing that does not exist yet. Revisit if that changes.
