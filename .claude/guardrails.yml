# Repository checklist. Re-audit as a diff against this file.
#
# This repository is public, so this file records only controls that are in
# place. Anything absent, unverified, or still being decided lives in the
# untracked local plan (.claude/improvement-plan.md) instead: a public list of
# a project's own gaps is a roadmap for whoever wants to use them.
#
# status: present | enforced
audited: 2026-08-19
visibility: public
last_audit_scope: >
  Re-audit as a diff. Verified this pass: gate and its runtime, workflow
  triggers and permissions, action pinning, ruleset rules and bypass actors,
  repository security settings, code scanning, toolchain portability, release
  tagging, merged-branch deletion, and the repository's own review and CI
  history. Nothing regressed; four controls were in place and unrecorded.

checks:
  - id: gate-runs-on-commit
    status: enforced
    by: .git/hooks/pre-commit -> scripts/check-repo.sh

  - id: broken-reference-fails-gate
    status: enforced
    by: skills/uplevel/selfcheck.sh

  - id: shipped-commands-parse
    status: enforced
    by: selfcheck.sh; bash -n on fenced blocks, plus grep -E pattern validation

  - id: skill-md-within-budget
    status: enforced
    by: selfcheck.sh; 6000 tokens, printed with the headroom on every run
    note: >-
      raised from 4000 on 2026-08-19. The ceiling exists because this file loads
      on every trigger for every user, so growth is a cost borne by someone else
      and should be deliberate. It is not a quality cap: when something belongs
      in the always-loaded file, it goes there and the number moves in the same
      change.

  - id: relative-links-resolve
    status: enforced
    by: scripts/check-repo.sh; tracked files only

  - id: hook-installed-and-current
    status: enforced
    by: scripts/check-repo.sh

  - id: hook-check-skipped-in-ci
    status: enforced
    by: scripts/check-repo.sh; CI env var guard

  - id: ci-on-push
    status: enforced
    by: .github/workflows/check.yml -> scripts/check-repo.sh

  - id: ci-on-pull-request
    status: enforced
    by: .github/workflows/check.yml -> scripts/check-repo.sh
    note: >-
      verified on a pull request that ran the real checks rather than passing
      vacuously; the CI guard correctly skipped the local hook check.

  - id: branch-protection-required-checks
    status: enforced
    by: ruleset "Protect main", active, no bypass actors
    note: >-
      requires a pull request, branches up to date, and two checks - "Repo gate"
      and "Analyze (actions)" from CodeQL. Blocks force-push and deletion.
      Verified behaviorally: a direct push to main was rejected with both the
      pull-request and required-status-check rules cited. CodeQL was added to
      the required set only once it had been observed running on a pull request
      head; an advisory check is ignored within a week.

  - id: secret-scanning
    status: enforced
    by: repository security settings; scanning, push protection, non-provider
        patterns and validity checks all enabled
    note: >-
      the last two are settable only in the web UI, under Settings > Advanced
      Security > Secret Protection, and their state is NOT observable through
      the REST API: PATCH /repos/{owner}/{repo} returns 200 and silently
      discards both fields, and GET reports them disabled while the UI shows
      them enabled. The UI is the ground truth here. A future audit reading the
      API will see "disabled" and be wrong - check the settings page before
      re-doing this.

  - id: dependabot-security-updates
    status: enforced
    by: vulnerability alerts + automated security fixes

  - id: action-update-automation
    status: enforced
    by: .github/dependabot.yml; github-actions ecosystem, monthly

  - id: security-policy
    status: present
    by: SECURITY.md

  - id: license
    status: present
    by: LICENSE (MIT)

  - id: code-scanning
    status: enforced
    by: CodeQL default setup, query suite "default", weekly
    note: >-
      languages ["actions"] - the workflow is the analyzable surface here.

  - id: branch-deleted-on-merge
    status: enforced
    by: repository setting delete_branch_on_merge

  - id: gate-scripts-portable
    status: enforced
    by: scripts/check-repo.sh against scripts/gnu-only-constructs.txt
    note: >-
      CI is ubuntu-latest (bash 5, GNU coreutils); a maintainer here runs
      bash 3.2 with ugrep and BSD sed, and the commit hook gates on that one.
      9 GNU-only constructs are checked for. Verified red-then-green.

  - id: skill-md-headroom-visible
    status: enforced
    by: selfcheck.sh prints tokens used, budget, and remainder
    note: >-
      the gate prints the live figure on every run, so this entry deliberately
      records no number - a pinned one went stale in a single commit. Growth is
      the thing to watch: one merge has consumed about 10 percent of the budget
      before now.

  - id: mode-working-set-visible
    status: enforced
    by: skills/uplevel/selfcheck.sh; prints tokens per mode on every run
    note: >-
      SKILL.md's budget is the entry cost, not the cost. A full Mode A audit
      reads most of references/ before touching the user's repository, and
      nothing was measuring that - so the number people optimized was a seventh
      of what an audit actually spends. Records no figure here for the same
      reason the SKILL.md entry does not. The file list is guarded: a rename
      that leaves it dangling fails the gate. Verified red-then-green.

  - id: load-cost-measured-not-estimated
    status: enforced
    by: >-
      skills/uplevel/selfcheck.sh; counts with tiktoken where it is importable, and asserts the
      ceilings only then. CI installs it
    note: >-
      a word count reads 3-9 percent low on this content - backticks, em-dashes,
      table pipes and the indentation on wrapped list lines all fragment into
      tokens it cannot see. Mode A measured 38862 by word count against 42141 by
      tokenizer, so the ceilings were compared against a figure that understated
      what a mode spends and the gate reported headroom against a limit already
      passed. Where the tokenizer is absent the estimate is still printed and
      nothing is asserted, because an unmeasured cost is unknown rather than
      passing; the commit hook degrades to that and CI is what keeps main
      guarded. All modes are counted in one pass, so the hook stays under a
      second.

  - id: mode-working-set-bounded
    status: enforced
    by: >-
      skills/uplevel/selfcheck.sh; fails when the Mode A working set exceeds its ceiling, currently
      44000
    note: >-
      printing the figure made growth visible and did not make it cost anything,
      and every addition lands in references/ where nothing had a ceiling. The
      entry cost was bounded and the spent cost was not. Raising the number in
      the change that needs the room is the sanctioned move; growing past it
      silently is what this prevents. remedies.md was missing from the Mode A
      list, which understated the working set by its whole length, and
      long-runs.md was in no list at all. Verified red-then-green. Raised from
      40000 on 2026-08-21, when measuring it properly showed the real cost had
      already passed it.

  - id: every-reference-measured
    status: enforced
    by: skills/uplevel/selfcheck.sh; fails when a shipped reference is in no mode-cost list
    note: >-
      the ceiling only bounds what it counts. remedies.md sat in no list while
      mode-a-investigate.md routed every plan through it, so the advertised Mode A
      cost was short by that file's whole length and nothing said so. This makes
      the next unlisted reference fail rather than quietly go unmeasured.
      Verified red-then-green.

  - id: checklist-parses
    status: enforced
    by: scripts/check-repo.sh; python3 + pyyaml, skipped when absent
    note: >-
      this file once shipped unparseable, because an unquoted "#" started a YAML
      comment mid-value and truncated the block. Nothing read the file, so
      nothing noticed. Multi-line notes use block scalars. Verified
      red-then-green.

  - id: checklist-is-current
    status: enforced
    by: >-
      scripts/check-repo.sh; fails when the audited date is missing, in the
      future, or more than 180 days old
    note: >-
      a dated file with no freshness check is a claim that decays silently. The
      gate now reads the date rather than trusting the reader to notice it.

  - id: push-protection-evidence
    status: enforced
    by: repository security settings, read through the API
    note: >-
      recorded on a settings read rather than a behavioral test, deliberately.
      A test was attempted once with vendor-published example keys, which
      scanners allowlist, and was inconclusive. Any string that would actually
      prove the control also looks like a real secret sitting in a public
      repository, so the test is not worth running here. This entry exists so
      the question is answered once instead of reopening at every audit.

  - id: private-vulnerability-reporting
    status: enforced
    by: repository setting; SECURITY.md directs reporters to it
    note: >-
      the policy previously named a channel that was not enabled, and its own
      fallback sent researchers to a public issue.

  - id: invariants-stated-in-skill-md
    status: enforced
    by: skills/uplevel/selfcheck.sh against skills/uplevel/invariants.txt
    note: >-
      11 rules that must appear in SKILL.md, which loads on every trigger. An
      invariant surviving only in a reference has been demoted behind a read,
      and the read may not happen. Two were anchored by hand and nine were not.
      Does NOT check that the deliberate restatements in mode-c-enforce.md and
      production.md still agree - those are paraphrases and cannot be diffed
      mechanically. Verified red-then-green, for deletion and for demotion.

  - id: leakage-scan-by-shape
    status: enforced
    by: skills/uplevel/selfcheck.sh against skills/uplevel/leak-patterns.txt
    note: >-
      scans *.md and *.sh for machine- and project-specific shapes. Patterns
      are held in a data file so they cannot match themselves. Verified
      red-then-green.

  - id: versioned-releases
    status: enforced
    by: git tag + GitHub release; version bump already gated at commit time
    note: >-
      the version in SKILL.md frontmatter and the tag carry the same number, so
      an installed copy can be identified. Verified by cloning the public
      repository at a tag into a clean HOME, installing twice, and running the
      shipped selfcheck.

  - id: tag-matches-declared-version
    status: enforced
    by: scripts/check-repo.sh; every v* tag's commit must declare that version
    note: >-
      the bump was gated and the tag was not, so main carried a version that
      had never been released and nothing noticed. Verified red-then-green.

  - id: prose-is-en-us
    status: enforced
    by: scripts/check-repo.sh against scripts/en-gb-spellings.txt
    note: >-
      47 spellings across tracked markdown and YAML, in one grep rather than one
      per pattern per file - the readable nested loop cost 3.3s of a 4.5s gate,
      on the pre-commit path. Verified red-then-green.

  - id: prose-wrap-ceiling
    status: enforced
    by: scripts/check-repo.sh; 105 characters, python3, skipped when absent
    note: >-
      counted in characters, not bytes: an em dash is three bytes, and a byte
      count flags correctly-wrapped prose. The ceiling is 105 rather than 100
      because the prose sits at 103 and a 100 limit would demand a reflow of
      every line rather than catch the lines nobody wrapped. Tables, fenced code
      and long URLs are exempt. Verified red-then-green.

  - id: documented-install-runs
    status: enforced
    by: scripts/check-install.sh, a step in the required "Repo gate" job
    note: >-
      extracts the install commands from README.md and skills/uplevel/README.md
      rather than restating them, and runs both against a clean HOME, each twice,
      plus the uninstall. Found two live defects on its first run. Too slow for
      the commit hook at about five seconds, so CI carries it.

  - id: new-check-recorded-in-checklist
    status: enforced
    by: >-
      scripts/check-repo.sh; commit time, against check-repo.sh, check-install.sh
      and selfcheck.sh
    note: >-
      the date check proves the checklist was looked at, not that it is true - it
      passed while four controls were in place and unrecorded. Counts assertions
      rather than section headings: a check added inside an existing section
      netted zero, which is how the entry for this rule came to be written by
      hand after PR #40. check-install.sh defines its own checks and was not
      watched at all. The signals live in scripts/gate-check-signals.txt because
      written inline they match their own source line - observed on the first
      attempt. Renames net to zero, a removal nets negative. Verified
      red-then-green across five cases.

  - id: changelog
    status: present
    by: CHANGELOG.md, linked from README.md

  - id: changelog-documents-declared-version
    status: enforced
    by: scripts/check-repo.sh; main's SKILL.md version must have a CHANGELOG entry
    note: >-
      v0.40.0 was tagged and released while its changelog PR was still open, so
      the tagged commit documents every version except the one it released. The
      tag is published and was left alone; retagging would leave two disagreeing
      copies in circulation. Checked forward on main rather than over history, so
      it gates the next tag while there is still time to write the entry.
      Verified red-then-green, plus the no-CHANGELOG skip path.

  - id: pull-request-template
    status: present
    by: .github/pull_request_template.md
    note: >-
      prompts for what CONTRIBUTING.md requires and the gate cannot check: that a
      new check was watched failing on the case that motivated it, that its skip
      path was exercised, that a loosened check still catches its original
      failure, and that every shipped command was run. A checklist, not a gate -
      it asks, it does not enforce.

  - id: contributing-guide
    status: present
    by: CONTRIBUTING.md
    note: >-
      names the gate, the rules it enforces, the one rule it cannot enforce
      (every shipped command must have been run), and the red-then-green plus
      skip-path requirement for any added check.
