# Repository checklist. Re-audit as a diff against this file.
#
# This repository is public, so this file records only controls that are in
# place. Anything absent, unverified, or still being decided lives in the
# untracked local plan (.claude/improvement-plan.md) instead: a public list of
# a project's own gaps is a roadmap for whoever wants to use them.
#
# status: present | enforced
audited: 2026-08-19
visibility: public
last_audit_scope: >
  Re-audit as a diff. Verified this pass: gate, workflow triggers and
  permissions, action pinning, ruleset, repository security settings,
  code scanning, toolchain portability, release tagging.

checks:
  - id: gate-runs-on-commit
    status: enforced
    by: .git/hooks/pre-commit -> scripts/check-repo.sh

  - id: broken-reference-fails-gate
    status: enforced
    by: skills/uplevel/selfcheck.sh

  - id: shipped-commands-parse
    status: enforced
    by: selfcheck.sh; bash -n on fenced blocks, plus grep -E pattern validation

  - id: skill-md-under-4k-tokens
    status: enforced
    by: selfcheck.sh

  - id: relative-links-resolve
    status: enforced
    by: scripts/check-repo.sh; tracked files only

  - id: hook-installed-and-current
    status: enforced
    by: scripts/check-repo.sh

  - id: hook-check-skipped-in-ci
    status: enforced
    by: scripts/check-repo.sh; CI env var guard

  - id: ci-on-push
    status: enforced
    by: .github/workflows/check.yml -> scripts/check-repo.sh

  - id: ci-on-pull-request
    status: enforced
    by: .github/workflows/check.yml -> scripts/check-repo.sh
    note: >-
      verified on a pull request that ran the real checks rather than passing
      vacuously; the CI guard correctly skipped the local hook check.

  - id: branch-protection-required-checks
    status: enforced
    by: ruleset "Protect main", active, no bypass actors
    note: >-
      requires a pull request, branches up to date, and two checks - "Repo gate"
      and "Analyze (actions)" from CodeQL. Blocks force-push and deletion.
      Verified behaviorally: a direct push to main was rejected with both the
      pull-request and required-status-check rules cited. CodeQL was added to
      the required set only once it had been observed running on a pull request
      head; an advisory check is ignored within a week.

  - id: secret-scanning
    status: enforced
    by: repository security settings; scanning and push protection both enabled

  - id: dependabot-security-updates
    status: enforced
    by: vulnerability alerts + automated security fixes

  - id: action-update-automation
    status: enforced
    by: .github/dependabot.yml; github-actions ecosystem, monthly

  - id: security-policy
    status: present
    by: SECURITY.md

  - id: license
    status: present
    by: LICENSE (MIT)

  - id: code-scanning
    status: enforced
    by: CodeQL default setup, query suite "default", weekly
    note: >-
      languages ["actions"] - the workflow is the analyzable surface here.

  - id: branch-deleted-on-merge
    status: enforced
    by: repository setting delete_branch_on_merge

  - id: gate-scripts-portable
    status: enforced
    by: scripts/check-repo.sh against scripts/gnu-only-constructs.txt
    note: >-
      CI is ubuntu-latest (bash 5, GNU coreutils); a maintainer here runs
      bash 3.2 with ugrep and BSD sed, and the commit hook gates on that one.
      9 GNU-only constructs are checked for. Verified red-then-green.

  - id: skill-md-headroom-visible
    status: enforced
    by: selfcheck.sh prints tokens used, budget, and remainder
    note: >-
      the gate prints the live figure on every run, so this entry deliberately
      records no number - a pinned one went stale in a single commit. Growth is
      the thing to watch: one merge has consumed about 10 percent of the budget
      before now.

  - id: checklist-parses
    status: enforced
    by: scripts/check-repo.sh; python3 + pyyaml, skipped when absent
    note: >-
      this file once shipped unparseable, because an unquoted "#" started a YAML
      comment mid-value and truncated the block. Nothing read the file, so
      nothing noticed. Multi-line notes use block scalars. Verified
      red-then-green.

  - id: checklist-is-current
    status: enforced
    by: >-
      scripts/check-repo.sh; fails when the audited date is missing, in the
      future, or more than 180 days old
    note: >-
      a dated file with no freshness check is a claim that decays silently. The
      gate now reads the date rather than trusting the reader to notice it.

  - id: private-vulnerability-reporting
    status: enforced
    by: repository setting; SECURITY.md directs reporters to it
    note: >-
      the policy previously named a channel that was not enabled, and its own
      fallback sent researchers to a public issue.

  - id: leakage-scan-by-shape
    status: enforced
    by: skills/uplevel/selfcheck.sh against skills/uplevel/leak-patterns.txt
    note: >-
      scans *.md and *.sh for machine- and project-specific shapes. Patterns
      are held in a data file so they cannot match themselves. Verified
      red-then-green.

  - id: versioned-releases
    status: enforced
    by: git tag + GitHub release; version bump already gated at commit time
    note: >-
      the version in SKILL.md frontmatter and the tag carry the same number, so
      an installed copy can be identified. Verified by cloning the public
      repository at a tag into a clean HOME, installing twice, and running the
      shipped selfcheck.

  - id: tag-matches-declared-version
    status: enforced
    by: scripts/check-repo.sh; every v* tag's commit must declare that version
    note: >-
      the bump was gated and the tag was not, so main carried a version that
      had never been released and nothing noticed. Verified red-then-green.

  - id: contributing-guide
    status: present
    by: CONTRIBUTING.md
    note: >-
      names the gate, the rules it enforces, the one rule it cannot enforce
      (every shipped command must have been run), and the red-then-green plus
      skip-path requirement for any added check.
